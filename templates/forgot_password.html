<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Medical AI - Forgot Password</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="auth-body">

  <nav class="navbar">
    <a href="{{ url_for('home') }}" class="nav-brand">
      <i class="fa-solid fa-heart-pulse nav-logo-icon"></i>
      <span class="brand-text">Medical <span class="brand-accent">AI</span></span>
    </a>
    <ul class="nav-links">
      <li><a href="{{ url_for('home') }}" class="nav-link"><i class="fa-solid fa-house"></i> Home</a></li>
    </ul>
    <a href="{{ url_for('login_page') }}" class="btn-login">
      <i class="fa-solid fa-right-to-bracket"></i> Login
    </a>
  </nav>

  <div class="auth-wrapper auth-wrapper-centered">
    <div class="auth-card auth-card-slim">

      <div class="auth-card-header">
        <div class="auth-card-icon forgot-icon"><i class="fa-solid fa-key"></i></div>
        <h3>Reset Password</h3>
        <p>Verify your identity to set a new password</p>
      </div>

      <div class="auth-alert" id="authAlert" style="display:none;"></div>

      <form class="auth-form" id="forgotForm">
        <div class="form-group">
          <label for="dr_name"><i class="fa-solid fa-user-doctor"></i> Doctor Name</label>
          <input type="text" id="dr_name" name="dr_name" placeholder="Enter your registered name" required />
        </div>

        <div class="form-group">
          <label for="med_reg_no"><i class="fa-solid fa-id-card"></i> Medical Registration No.</label>
          <input type="text" id="med_reg_no" name="med_reg_no" placeholder="e.g. MCI-12345" required />
        </div>

        <div class="form-group">
          <label for="new_password"><i class="fa-solid fa-lock"></i> New Password</label>
          <div class="input-wrap">
            <input type="password" id="new_password" name="new_password" placeholder="Enter new password" required />
            <button type="button" class="toggle-pw" onclick="togglePassword('new_password', this)">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-auth forgot-btn" id="forgotBtn">
          <i class="fa-solid fa-rotate-right"></i>
          <span>Reset Password</span>
          <div class="btn-spinner" id="forgotSpinner" style="display:none;"></div>
        </button>
      </form>

      <div class="auth-divider"><span>Remembered your password?</span></div>
      <a href="{{ url_for('login_page') }}" class="btn-auth-outline">
        <i class="fa-solid fa-right-to-bracket"></i> Back to Sign In
      </a>

    </div>
  </div>

  <script>
    function togglePassword(fieldId, btn) {
      const field = document.getElementById(fieldId);
      const icon  = btn.querySelector('i');
      if (field.type === 'password') {
        field.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        field.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    function showAlert(message, type) {
      const box = document.getElementById('authAlert');
      box.className = `auth-alert alert-${type}`;
      box.innerHTML = `<i class="fa-solid fa-${type === 'success' ? 'circle-check' : type === 'warning' ? 'triangle-exclamation' : 'circle-xmark'}"></i> ${message}`;
      box.style.display = 'flex';
    }

    document.getElementById('forgotForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn     = document.getElementById('forgotBtn');
      const spinner = document.getElementById('forgotSpinner');
      document.getElementById('authAlert').style.display = 'none';

      btn.disabled = true;
      spinner.style.display = 'inline-block';

      const formData = new FormData(this);
      try {
        const res  = await fetch('/forgot_password', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.status === 'success') {
          showAlert('Password reset successfully! Redirecting to login...', 'success');
          setTimeout(() => { window.location.href = '/login'; }, 1500);
        } else {
          showAlert('Doctor name or registration number not found.', 'error');
        }
      } catch (err) {
        showAlert('Server error. Please try again later.', 'error');
      } finally {
        btn.disabled = false;
        spinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
